<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guagua: Test für lokale Dateien</title>
<style>
  body { margin: 0; padding: 32px 28px; background: #FAFBFC; color: #18233D; font: 19px/1.4 -apple-system, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 0 0 16px; }
  ul { margin: 0 0 24px; padding: 0; list-style: none; border-bottom: 1px solid #D8DDE5; }
  li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid #D8DDE5; }
  .ja { color: #1C6B48; font-weight: 600; }
  .nein { color: #B3261E; font-weight: 600; }
  button { width: 100%; height: 60px; border: 0; border-radius: 8px; background: #2546C7; color: #FFFFFF; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<h1>Test für lokale Dateien</h1>
<p id="hinweis">Wenn du nur diesen Absatz siehst und darunter nichts erscheint, führt diese Ansicht keine Skripte aus. Die Lern-App würde hier leer bleiben.</p>
<ul id="liste"></ul>
<button id="hola" type="button" hidden>„Hola, buenos días“ sprechen</button>

<script>
  // Prüft, was eine lokal geöffnete HTML-Datei auf diesem Gerät darf. Es werden keine Daten gesendet.
  var liste = document.getElementById("liste");
  function zeile(text, ok, detail) {
    var li = document.createElement("li");
    var links = document.createElement("span");
    links.textContent = text;
    var rechts = document.createElement("span");
    rechts.className = ok ? "ja" : "nein";
    rechts.textContent = (ok ? "ja" : "nein") + (detail ? ", " + detail : "");
    li.appendChild(links);
    li.appendChild(rechts);
    liste.appendChild(li);
  }

  document.getElementById("hinweis").textContent = "Skripte laufen in dieser Ansicht. Die Zeilen zeigen, was sonst noch geht.";
  zeile("Skripte laufen", true);
  zeile("Geöffnet über", location.protocol === "https:", location.protocol);

  var speicher = false;
  var besuche = 0;
  try {
    besuche = Number(localStorage.getItem("guagua-test") || "0") + 1;
    localStorage.setItem("guagua-test", String(besuche));
    speicher = localStorage.getItem("guagua-test") === String(besuche);
  } catch (e) { speicher = false; }
  zeile("Lernstand lässt sich speichern", speicher, speicher ? "Aufruf Nr. " + besuche : "");

  zeile("Offline-Betrieb als installierte App", "serviceWorker" in navigator && window.isSecureContext);

  var kannSprechen = "speechSynthesis" in window;
  zeile("Sprachausgabe vorhanden", kannSprechen);
  if (kannSprechen) {
    var knopf = document.getElementById("hola");
    knopf.hidden = false;
    knopf.addEventListener("click", function () {
      var satz = new SpeechSynthesisUtterance("Hola, buenos días");
      satz.lang = "es-ES";
      satz.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(satz);
    });
  }
</script>
</body>
</html>
